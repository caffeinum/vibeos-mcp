name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # real pairing rules over a local ws relay, fake tab, this package over
      # real MCP stdio — the relay is inline in e2e.mjs, nothing fetched
      - run: node e2e.mjs
